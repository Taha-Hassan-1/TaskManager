name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-only-Passw0rd!"
        ports:
          - 1433:1433
    env:
      # Migration tests create and drop their own throwaway databases on this server.
      TEST_SQL_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Ci-only-Passw0rd!;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TaskManager.slnx
      - run: dotnet build TaskManager.slnx --no-restore -warnaserror
      - run: dotnet test TaskManager.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The generated API client must match client/openapi.json (which the backend tests keep in step with the API).
      - name: Generated API client is up to date
        run: |
          npx ng-openapi-gen
          git diff --exit-code -- src/app/api
      - run: npm test -- --no-watch
      - run: npm run build

