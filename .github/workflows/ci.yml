name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-only-Passw0rd!"
        ports:
          - 1433:1433
    env:
      # Migration and API tests create and drop their own throwaway databases on this server.
      TEST_SQL_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Ci-only-Passw0rd!;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TeamBoard.slnx
      - run: dotnet build TeamBoard.slnx --no-restore -warnaserror
      - run: dotnet test TeamBoard.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The generated API client must match client/openapi.json (which the backend tests keep in step with the API).
      - name: Generated API client is up to date
        run: |
          npx ng-openapi-gen
          git diff --exit-code -- src/app/api
      - run: npm test -- --no-watch
      - run: npm run build

  # Two browsers on the real app: the API in Release serving the built Angular app, on a throwaway database.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-only-Passw0rd!"
        ports:
          - 1433:1433
    env:
      E2E_SQL_SERVER: "Server=localhost,1433;User Id=sa;Password=Ci-only-Passw0rd!;TrustServerCertificate=True"
      E2E_KEEP_DB: "1" # the service container is discarded with the job
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run e2e # ng build, then Playwright with the Chrome the runner already has
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: client/test-results/

  # The image builds on every push. On main it is also published to GitHub's container registry, where the host pulls it from.
  # After the first publish, make the package public once (GitHub > Packages > teamboard > Package settings).
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag teamboard:${{ github.sha }} .
      - name: Publish (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registry names must be lower case
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag teamboard:${{ github.sha }} "ghcr.io/$owner/teamboard:${{ github.sha }}"
          docker tag teamboard:${{ github.sha }} "ghcr.io/$owner/teamboard:latest"
          docker push "ghcr.io/$owner/teamboard:${{ github.sha }}"
          docker push "ghcr.io/$owner/teamboard:latest"
